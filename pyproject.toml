[project]
name = "campus-venue-assistant"
version = "0.1.0"
description = "BSAI408 read-only campus venue query prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai-agents",
    "mcp>=1.26,<2",
    "pydantic",
    "gradio",
    "tzdata",
    "pywin32>=312 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
