name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Read-only prototype (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      GRADIO_ANALYTICS_ENABLED: 'False'
      CAMPUS_NOW: '2026-10-20T09:00:00+08:00'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.23'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Check dependency compatibility
        run: uv pip check
      - name: Run business, MCP and UI callback tests
        run: uv run --locked python -m pytest -q
      - name: Seed simulated data
        run: uv run --locked python -m scripts.seed --base-date 2026-10-20
      - name: Verify SDK and MCP subprocess integration
        run: uv run --locked python -m scripts.smoke
      - name: Compile Python modules
        run: uv run --locked python -m compileall -q app agent_layer domain mcp_server storage scripts
